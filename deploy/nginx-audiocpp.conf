# Balanceia entre as duas V100. Cada backend e uma instancia presa a uma placa.
upstream audiocpp_pool {
    # zone: o estado de balanceamento do nginx e POR WORKER por padrao. Com 36
    # workers e poucas requisicoes, cada worker escolhia o primeiro backend e
    # tudo caia numa placa. A zone compartilha o estado entre todos os workers.
    zone audiocpp_pool 64k;

    # least_conn: sinteses tem duracao muito variavel; round-robin enfileiraria
    # numa placa enquanto a outra ocia.
    least_conn;

    # Sem max_conns: no nginx open-source ele devolve 502 quando todos os
    # backends estao no limite (a diretiva 'queue' e exclusiva do NGINX Plus).
    server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;  # GPU 0
    server 127.0.0.1:8082 max_fails=3 fail_timeout=30s;  # GPU 1
}

log_format upstreamlog '$remote_addr -> $upstream_addr [$status] $request_time s';
server {
    listen 8080;
    access_log /var/log/nginx/audiocpp.log upstreamlog;
    server_name _;

    # Upload de audio para transcricao/clonagem de voz
    client_max_body_size 512M;
    client_body_timeout 300s;

    location / {
        proxy_pass http://audiocpp_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Sintese longa pode levar minutos; o padrao de 60s cortaria a requisicao
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Se uma placa cair, tenta a outra
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Endpoints de streaming (SSE): buffering tem que ficar desligado,
    # senao o nginx segura os deltas e o streaming deixa de ser streaming
    location ~ ^/v1/audio/(speech|transcriptions)/live {
        proxy_pass http://audiocpp_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
